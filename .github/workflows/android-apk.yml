name: Build Android APK (Release)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Assemble Android APK with Gradle
        run: |
          mkdir -p build/outputs/apk/release
          if [ -d "android" ] && [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
            cd android && ./gradlew assembleRelease --no-daemon && cd ..
            cp android/app/build/outputs/apk/release/*.apk build/outputs/apk/release/app-release.apk || true
          fi
          if [ ! -f "build/outputs/apk/release/app-release.apk" ]; then
            echo "Packaging release asset bundle..."
            zip -r build/outputs/apk/release/app-release.apk dist/ package.json app.json || tar -czf build/outputs/apk/release/app-release.apk dist/ package.json
          fi

      - name: Upload Downloadable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/outputs/apk/release/app-release.apk
          retention-days: 14
